# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_5                         # unique; used in DB, logs, secret names
    tiktok_username: "farmgirl.brookeelwood"  # no @  -- knife sharpening + Case pocket-knife collection ("farm girl & Grandad Jim"). 44.5K followers / 3.2M likes, no YouTube found (checked directly, no matching channel in search). Promoted 2026-09-30: fc45ac22 (axe/knife throwing) was getting ~0 views for weeks; soulthrower (considered as a same-niche replacement) turned out to have an active 428K-subscriber YouTube channel posting the identical content -- disqualified, moved out entirely, not even kept as backup.
    tiktok_username_backup: "fc45ac22"    # no @ -- emergency-only fallback (the previous primary: axe/knife throwing trick shots). Known-quantity, was already running here before.
    youtube_channel_name: "Axe Factor"
    owner_email: "dkdhaker00000095@gmail.com"

    google_credentials_file: "credentials/channel_5_client_secret.json"
    oauth_token_file: "tokens/channel_5_token.json"

    videos_per_day: 1
    description_footer: ""
    default_tags: [knife sharpening, satisfying, oddly satisfying, sharpening asmr,
                   knife restoration, pocket knife, sharp knife, before and after,
                   knife collection, so satisfying, blade sharpening, satisfying video,
                   razor sharp, knife asmr, restoration, sharpening knife, edc,
                   case knife, satisfying transformation, knife care]
    youtube_category_id: "26"             # 26 Howto & Style (sharpening / knife care)
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    min_video_seconds: 12                 # skip clips shorter than 12s
    max_video_seconds: 170                # keep it in Shorts range
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 3.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.05
      contrast: 1.05
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 10
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [230, 60, 45]
      hook_templates:
        - "SO SATISFYING"
        - "RAZOR SHARP"
        - "WATCH THIS TRANSFORM"
        - "BEFORE vs AFTER"

    slot_publish_times_utc:               # this IS the cron fire time
      1: "14:30"                          # 8:00 PM IST
